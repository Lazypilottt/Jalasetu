; sys3 stage worker: any heavy stage, one at a time, admitted only with
; enough memory headroom under the 500 MB budget.
; Install: sudo cp deploy/supervisor/sys3.conf /etc/supervisor/conf.d/jalasetu.conf
;          sudo supervisorctl update jalasetu
[program:jalasetu]
directory=/home/student/Jalasetu
command=/home/student/Jalasetu/venv/bin/uvicorn distributed.sys3:app --interface wsgi --host 0.0.0.0 --port 3000 --workers 1 --timeout-keep-alive 5
autostart=true
autorestart=true
startsecs=8
stopasgroup=true
killasgroup=true
user=student
stderr_logfile=/var/log/jalasetu/jalasetu-stderr.log
stdout_logfile=/var/log/jalasetu/jalasetu-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2
environment=PATH="/home/student/Jalasetu/venv/bin",PYTHONPATH="/home/student/Jalasetu",JALASETU_WORKER_SLOTS="1",JALASETU_STAGE_RESERVE_MB="150",OTEL_SERVICE_NAME="jalasetu-sys3-terrain",OTEL_EXPORTER_OTLP_ENDPOINT="http://172.17.0.2:4317",JALASETU_OTEL_ENABLED="true",MALLOC_ARENA_MAX="2",OMP_NUM_THREADS="1",OPENBLAS_NUM_THREADS="1",MKL_NUM_THREADS="1",NUMBA_NUM_THREADS="1",JALASETU_MEMORY_BUDGET_MB="500",JALASETU_STORAGE_BUDGET_MB="1536"
