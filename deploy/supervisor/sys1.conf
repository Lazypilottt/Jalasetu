; sys1 edge: SPA + climate API, standard library only (no virtualenv).
; Install: sudo cp deploy/supervisor/sys1.conf /etc/supervisor/conf.d/jalasetu.conf
;          sudo supervisorctl update jalasetu
[program:jalasetu]
directory=/home/student/Jalasetu
command=/usr/bin/python3 -m distributed.sys1
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
user=student
stderr_logfile=/var/log/jalasetu/jalasetu-stderr.log
stdout_logfile=/var/log/jalasetu/jalasetu-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2
environment=PYTHONPATH="/home/student/Jalasetu",PORT="3000",GATEWAY_URL="http://172.17.0.5:3000",JALASETU_NODE_NAME="sys1",JALASETU_FRONTEND_DIST="/home/student/Jalasetu/frontend/dist",MALLOC_ARENA_MAX="2",OMP_NUM_THREADS="1",OPENBLAS_NUM_THREADS="1",MKL_NUM_THREADS="1",NUMBA_NUM_THREADS="1",JALASETU_MEMORY_BUDGET_MB="500",JALASETU_STORAGE_BUDGET_MB="1536"
