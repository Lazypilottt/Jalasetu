; sys4 gateway: job queue + capacity-aware scheduler behind Nginx (:3000/:3204).
; It runs a stage itself only when sys2/sys3 are busy and it has headroom.
; Install: sudo cp deploy/supervisor/sys4.conf /etc/supervisor/conf.d/jalasetu.conf
;          sudo supervisorctl update jalasetu
[program:jalasetu]
directory=/home/student/Jalasetu
command=/home/student/Jalasetu/venv/bin/uvicorn distributed.sys4:app --interface wsgi --host 127.0.0.1 --port 8000 --workers 1 --timeout-keep-alive 5
autostart=true
autorestart=true
startsecs=8
stopasgroup=true
killasgroup=true
user=student
stderr_logfile=/var/log/jalasetu/jalasetu-stderr.log
stdout_logfile=/var/log/jalasetu/jalasetu-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2
environment=PATH="/home/student/Jalasetu/venv/bin",PYTHONPATH="/home/student/Jalasetu",JALASETU_PORT="8000",JALASETU_NODE_NAME="sys4",JALASETU_WORKERS="sys2=http://172.17.0.3:3000,sys3=http://172.17.0.4:3000",JALASETU_EDGE_URL="http://172.17.0.2:3000",JALASETU_REQUEST_TIMEOUT="150",JALASETU_QUEUE_TIMEOUT="90",JALASETU_MAX_ACTIVE_JOBS="2",JALASETU_MAX_QUEUED_JOBS="6",JALASETU_MAX_QUEUED_MB="64",JALASETU_WORKER_SLOTS="1",JALASETU_STAGE_RESERVE_MB="150",OTEL_SERVICE_NAME="jalasetu-sys4-gateway",OTEL_EXPORTER_OTLP_ENDPOINT="http://172.17.0.2:4317",JALASETU_OTEL_ENABLED="true",MALLOC_ARENA_MAX="2",OMP_NUM_THREADS="1",OPENBLAS_NUM_THREADS="1",MKL_NUM_THREADS="1",NUMBA_NUM_THREADS="1",JALASETU_MEMORY_BUDGET_MB="500",JALASETU_STORAGE_BUDGET_MB="1536"
