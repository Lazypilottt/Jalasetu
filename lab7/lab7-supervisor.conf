; Lab 7 proximity search API under Supervisor. deploy_lab7.sh fills in
; __PORT__ (8101-8104 on sys1-sys4) and installs this as
; /etc/supervisor/conf.d/lab7-location-api.conf.
[program:lab7-location-api]
directory=/home/student/lab7
; start_lab7.sh runs uvicorn (1 worker per node, 64-connection limit, 2048
; backlog); and clears processes left behind if a previous one was killed.
command=/home/student/lab7/start_lab7.sh __PORT__
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/student/lab7-supervisor.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
user=student
environment=PATH="/home/student/lab7/venv/bin:/usr/bin:/bin",PYTHONPATH="/home/student/lab7",LOCATION_DATASET="/home/student/lab7/locations.csv",MALLOC_ARENA_MAX="2"
