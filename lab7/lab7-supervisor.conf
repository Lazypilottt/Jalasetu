[program:lab7-location-api]
directory=/home/student/lab7
command=/home/student/.local/bin/uvicorn app.main:app --host 0.0.0.0 --port 8100 --workers 2 --limit-concurrency 64 --backlog 2048 --timeout-keep-alive 5
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/student/lab7-supervisor.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
user=student
environment=PATH="/usr/local/bin:/usr/bin:/bin",PYTHONPATH="/home/student/lab7"
