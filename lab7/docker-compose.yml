# Lab 7 proximity search stack. Start everything with:
#   docker compose up -d --build
name: lab7

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab7-api:1.0
    environment:
      LOCATION_DATASET: /data/locations.csv
      API_PORT: ${API_PORT:-8100}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      UVICORN_LIMIT_CONCURRENCY: ${UVICORN_LIMIT_CONCURRENCY:-64}
      UVICORN_BACKLOG: ${UVICORN_BACKLOG:-2048}
    volumes:
      # Swap in another dataset (e.g. a 1M-row CSV) without rebuilding.
      - type: bind
        source: ${DATASET_FILE:-./locations.csv}
        target: /data/locations.csv
        read_only: true
    expose:
      - "${API_PORT:-8100}"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  gateway:
    build:
      context: ./gateway
    image: lab7-gateway:1.0
    environment:
      API_HOST: api
      API_PORT: ${API_PORT:-8100}
      GATEWAY_PORT: "3204"
    ports:
      - "${GATEWAY_PORT:-3204}:3204"
    volumes:
      - gateway-logs:/var/log/nginx/lab7
    networks:
      - frontend
      - backend
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

networks:
  # Published gateway port lives here.
  frontend:
  # No route to the host or internet; only the gateway can reach the API.
  backend:
    internal: true

volumes:
  gateway-logs:
