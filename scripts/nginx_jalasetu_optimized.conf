# JalaSetu optimized reverse-proxy configuration for sys4
# Active backend selection is written by cluster_health_prober.py. Ubuntu's
# open-source Nginx does not provide the commercial health_check directive.
include /home/student/Jalasetu/runtime/jalasetu_upstream_maps.conf;

# Pools contain one active-check-selected endpoint each. No passive max_fails
# or backup servers are used; the prober switches the map after health checks.
upstream sys2_parsing_primary {
    server 172.17.0.3:3000;
    keepalive 4;
}
upstream sys2_parsing_fallback {
    server 172.17.0.4:3000;
    keepalive 4;
}
upstream sys3_terrain_primary {
    server 172.17.0.4:3000;
    keepalive 4;
}
upstream sys3_terrain_fallback {
    server 172.17.0.3:3000;
    keepalive 4;
}
upstream jalasetu_unavailable {
    server 127.0.0.1:9;
}

# sys4 gateway: catchment delineation, full pipeline orchestration
upstream sys4_gateway {
    server 127.0.0.1:8000;
    keepalive 4;
}

# sys1: static frontend SPA
upstream sys1_frontend {
    server 172.17.0.2:3000;
    keepalive 8;
}

server {
    listen 3000 default_server;
    listen 3204;
    server_name _;

    # Upload limit: 100 MB to accommodate large KML/KMZ files
    client_max_body_size 100M;

    # ── Graceful JSON error bodies instead of hangs ──────────────────────────
    error_page 429 @err429;
    error_page 502 503 504 @err5xx;

    location @err429 {
        default_type application/json;
        return 429 '{"error":"Too many concurrent requests – please retry after a few seconds","code":429}\n';
    }

    location @err5xx {
        default_type application/json;
        return 503 '{"error":"A backend service is temporarily unavailable. The pipeline auto-recovers after load drops.","code":503}\n';
    }

    # ── Cluster health status endpoint (served from live prober status) ───────
    location /v1/cluster/status {
        default_type application/json;
        alias /tmp/cluster_health.json;
    }

    # ── /health — fast liveness probe for gateway ─────────────────────────────
    location /health {
        limit_req zone=light_ip burst=15 nodelay;

        proxy_pass         http://$sys4_gateway_target;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_connect_timeout  3s;
        proxy_send_timeout     5s;
        proxy_read_timeout     5s;
    }

    # ── /v1/parse — multipart KML/KMZ upload → sys2 ───────────────────────────
    location /v1/parse {
        limit_req  zone=heavy_ip burst=2 nodelay;
        limit_conn per_ip 2;

        proxy_pass         http://$sys2_parsing_target;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_connect_timeout  5s;
        proxy_send_timeout     60s;
        proxy_read_timeout     120s;
    }

    # ── /v1/dem — JSON body DEM interpolation → sys2 ──────────────────────────
    location /v1/dem {
        limit_req  zone=heavy_ip burst=2 nodelay;
        limit_conn per_ip 2;

        proxy_pass         http://$sys2_parsing_target;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_connect_timeout  5s;
        proxy_send_timeout     60s;
        proxy_read_timeout     120s;
    }

    # ── /v1/prepare — atomic parse+DEM → sys2 ─────────────────────────────────
    location /v1/prepare {
        limit_req  zone=heavy_ip burst=1 nodelay;
        limit_conn per_ip 1;

        proxy_pass         http://$sys2_parsing_target;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_connect_timeout  5s;
        proxy_send_timeout     90s;
        proxy_read_timeout     180s;
    }

    # ── /v1/terrain — terrain derivatives (slope, TWI) → sys3 ────────────────
    location /v1/terrain {
        limit_req  zone=heavy_ip burst=2 nodelay;
        limit_conn per_ip 2;

        proxy_pass         http://$sys3_terrain_target;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_connect_timeout  5s;
        proxy_send_timeout     60s;
        proxy_read_timeout     150s;
    }

    # ── /v1/rank — pond-site ranking (MCDM scoring) → sys3 ───────────────────
    location /v1/rank {
        limit_req  zone=heavy_ip burst=2 nodelay;
        limit_conn per_ip 2;

        proxy_pass         http://$sys3_terrain_target;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_connect_timeout  5s;
        proxy_send_timeout     60s;
        proxy_read_timeout     120s;
    }

    # ── /analyzeContour — full pipeline orchestration ────────────────────────
    location /analyzeContour {
        limit_req  zone=gateway_ip burst=1 nodelay;
        limit_conn per_ip 1;
        limit_conn global_gateway 2;

        proxy_pass         http://$sys4_gateway_target;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_connect_timeout  5s;
        proxy_send_timeout     90s;
        proxy_read_timeout     300s;
    }

    # ── /findCatchment — catchment delineation ───────────────────────────────
    location /findCatchment {
        limit_req  zone=gateway_ip burst=1 nodelay;
        limit_conn per_ip 1;
        limit_conn global_gateway 2;

        proxy_pass         http://$sys4_gateway_target;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_connect_timeout  5s;
        proxy_send_timeout     90s;
        proxy_read_timeout     300s;
    }

    # ── / — static SPA frontend (sys1) ───────────────────────────────────────
    location / {
        limit_req zone=light_ip burst=30 nodelay;

        proxy_pass         http://$sys1_frontend_target;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_connect_timeout  5s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
    }
}
