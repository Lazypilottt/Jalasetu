# /etc/nginx/conf.d/jalasetu_limits.conf
# Shared-memory zones for rate limiting and connection limits

# Per-IP connection tracking (10 MB = ~160k simultaneous IPs tracked)
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

# Global connection tracking on heavy gateway to protect single-worker instances
limit_conn_zone $server_name zone=global_gateway:1m;

# Heavy pipeline endpoints (parse/DEM/terrain/rank): 1 req/s per IP
limit_req_zone $binary_remote_addr zone=heavy_ip:10m rate=1r/s;

# Gateway full pipeline (/analyzeContour, /findCatchment): 1 req/s per IP
limit_req_zone $binary_remote_addr zone=gateway_ip:10m rate=1r/s;

# Light endpoints (frontend SPA, health probes): 30 req/s per IP
limit_req_zone $binary_remote_addr zone=light_ip:2m rate=30r/s;

# Return 429 (not 503) for rate-limited and connection-limited requests
limit_req_status 429;
limit_conn_status 429;
