# Initial active routing state. cluster_health_prober.py replaces these maps
# after its first health-check cycle and reloads Nginx when health changes.
map $host $sys2_parsing_target { default sys2_parsing_primary; }
map $host $sys3_terrain_target { default sys3_terrain_primary; }
map $host $sys1_frontend_target { default sys1_frontend; }
map $host $sys4_gateway_target { default sys4_gateway; }
