apiVersion: 1

# Backends run on sys1 (172.17.0.2); grafana-local.sh tunnels them to this laptop.
# JALASETU_BACKEND_HOST is 127.0.0.1 for native Grafana, host.docker.internal inside Docker.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://${JALASETU_BACKEND_HOST}:19090
    isDefault: true
    jsonData:
      timeInterval: 10s

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://${JALASETU_BACKEND_HOST}:13200
    jsonData:
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} | trace_id="$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://${JALASETU_BACKEND_HOST}:13100
    jsonData:
      derivedFields:
        # OTLP logs: trace_id is stored as Loki structured metadata
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: View trace in Tempo
